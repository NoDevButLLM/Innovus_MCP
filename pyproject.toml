[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "innovus-mcp"
version = "0.1.0"
description = "Shared tmux-hosted Innovus sessions and asynchronous FastMCP tools"
requires-python = ">=3.11"
dependencies = ["fastmcp==2.14.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[project.scripts]
innovus-mcp = "innovus_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
innovus_mcp = ["tcl/*.tcl", "opencode_instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
